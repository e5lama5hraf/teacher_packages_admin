<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة الباكدجات التسويقية للمدرسين</title>
  <style>
    :root {
      --blue-950: #07111f;
      --blue-900: #0f172a;
      --blue-800: #1e3a8a;
      --blue-700: #1d4ed8;
      --blue-600: #2563eb;
      --blue-500: #3b82f6;
      --blue-100: #dbeafe;
      --blue-50: #eff6ff;
      --white: #ffffff;
      --soft: #f8fbff;
      --line: #dbeafe;
      --text: #172033;
      --muted: #64748b;
      --green: #16a34a;
      --orange: #d97706;
      --red: #dc2626;
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
      --soft-shadow: 0 16px 40px rgba(37, 99, 235, 0.10);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Cairo", "Tahoma", sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 10%, rgba(37, 99, 235, 0.18), transparent 26%),
        radial-gradient(circle at 90% 0%, rgba(29, 78, 216, 0.14), transparent 28%),
        linear-gradient(180deg, #f7fbff 0%, #eef5ff 45%, #ffffff 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(29, 78, 216, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(29, 78, 216, 0.045) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent 80%);
      z-index: -2;
    }

    header {
      position: relative;
      overflow: hidden;
      color: var(--white);
      padding: 42px 24px 48px;
      text-align: center;
      background:
        radial-gradient(circle at 20% 30%, rgba(96, 165, 250, 0.55), transparent 30%),
        linear-gradient(135deg, var(--blue-950), var(--blue-800) 52%, var(--blue-600));
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.22);
    }

    header::before,
    header::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,0.11);
      filter: blur(1px);
    }

    header::before {
      width: 260px;
      height: 260px;
      right: -80px;
      top: -100px;
    }

    header::after {
      width: 360px;
      height: 360px;
      left: -140px;
      bottom: -210px;
    }

    header h1 {
      position: relative;
      font-size: clamp(28px, 4vw, 44px);
      margin-bottom: 12px;
      letter-spacing: -0.8px;
      z-index: 1;
    }

    header p {
      position: relative;
      opacity: 0.9;
      font-size: 16px;
      z-index: 1;
    }

    .container {
      width: min(1440px, 94%);
      margin: -24px auto 36px;
      position: relative;
      z-index: 2;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(219, 234, 254, 0.95);
      border-radius: var(--radius-xl);
      box-shadow: var(--soft-shadow);
      backdrop-filter: blur(16px);
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      background: linear-gradient(180deg, #ffffff, #f8fbff);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 15px 18px;
      font-size: 15px;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
      transition: 0.25s;
    }

    .search-box:focus {
      border-color: var(--blue-500);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14);
    }



    .portal-intro {
      text-align: center;
      margin: 0 auto 22px;
      padding: 10px 12px;
    }

    .portal-intro h2 {
      font-size: clamp(24px, 3vw, 38px);
      color: var(--blue-950);
      margin-bottom: 8px;
      letter-spacing: -0.7px;
    }

    .portal-intro p {
      color: var(--muted);
      font-weight: 800;
    }

    .portal-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      margin-bottom: 28px;
    }

    .portal-card {
      min-height: 310px;
      border: 0;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border-radius: 34px;
      padding: 28px;
      color: #fff;
      text-align: right;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.20);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      isolation: isolate;
    }

    .portal-card::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 33px;
      border: 1px solid rgba(255,255,255,0.28);
      pointer-events: none;
      z-index: 2;
    }

    .portal-card::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      left: -70px;
      bottom: -80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.16);
      filter: blur(1px);
      z-index: -1;
    }

    .portal-card:hover {
      transform: translateY(-10px) scale(1.015);
      box-shadow: 0 38px 100px rgba(15, 23, 42, 0.30);
    }

    .portal-card .portal-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      font-weight: 900;
      font-size: 13px;
      backdrop-filter: blur(10px);
      margin-bottom: 18px;
    }

    .portal-card h2 {
      font-size: clamp(26px, 3vw, 40px);
      line-height: 1.22;
      margin-bottom: 12px;
      position: relative;
      z-index: 3;
    }

    .portal-card p {
      color: rgba(255,255,255,0.86);
      font-weight: 800;
      line-height: 1.8;
      max-width: 310px;
      position: relative;
      z-index: 3;
    }

    .portal-meta {
      position: absolute;
      right: 24px;
      bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 4;
      font-weight: 900;
    }

    .portal-count {
      min-width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.26);
      border-radius: 14px;
      backdrop-filter: blur(12px);
    }

    .portal-icon {
      position: absolute;
      left: 24px;
      bottom: 24px;
      width: 128px;
      height: 128px;
      display: grid;
      place-items: center;
      z-index: 1;
    }

    .facebook-card {
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,0.28), transparent 34%),
        linear-gradient(135deg, #0b4fd8, #1877f2 55%, #72b6ff);
      border-radius: 38px;
    }

    .facebook-card .portal-icon {
      border-radius: 34px;
      background: rgba(255,255,255,0.18);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.22), 0 18px 40px rgba(0,0,0,0.16);
      font-size: 122px;
      font-family: Arial, sans-serif;
      font-weight: 900;
      line-height: 1;
      padding-top: 22px;
    }

    .youtube-card {
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,0.24), transparent 34%),
        linear-gradient(135deg, #7f0000, #ff0033 54%, #ff7a7a);
    }

    .youtube-card .portal-icon {
      width: 160px;
      height: 112px;
      border-radius: 32px;
      background: rgba(255,255,255,0.18);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.22), 0 18px 40px rgba(0,0,0,0.16);
    }

    .youtube-card .portal-icon::before {
      content: "";
      width: 0;
      height: 0;
      border-top: 25px solid transparent;
      border-bottom: 25px solid transparent;
      border-right: 42px solid #fff;
      transform: rotate(180deg) translateX(-4px);
    }

    .studio-card {
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.28), transparent 32%),
        linear-gradient(135deg, #111827, #334155 55%, #38bdf8);
    }

    .studio-card .portal-icon {
      width: 150px;
      height: 118px;
      border-radius: 24px;
      background: rgba(255,255,255,0.14);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.22), 0 18px 40px rgba(0,0,0,0.18);
    }

    .studio-card .portal-icon::before {
      content: "";
      position: absolute;
      width: 92px;
      height: 62px;
      bottom: 18px;
      right: 20px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 -32px 0 -14px rgba(255,255,255,0.88);
    }

    .studio-card .portal-icon::after {
      content: "";
      position: absolute;
      width: 38px;
      height: 38px;
      border: 10px solid #0f172a;
      border-radius: 50%;
      bottom: 30px;
      right: 47px;
      background: #38bdf8;
      box-shadow: -58px -22px 0 -8px #fff;
    }

    .view-section {
      display: none;
      animation: fadeUp 0.38s ease both;
    }

    .view-section.active {
      display: block;
    }

    .back-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .back-btn {
      border: 0;
      border-radius: 16px;
      padding: 13px 18px;
      cursor: pointer;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, var(--blue-950), var(--blue-700));
      box-shadow: 0 14px 28px rgba(15,23,42,0.16);
      transition: 0.25s;
    }

    .back-btn:hover {
      transform: translateY(-2px);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1050px) {
      .portal-cards {
        grid-template-columns: 1fr;
      }

      .portal-card {
        min-height: 250px;
      }
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 28px;
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .section {
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.88);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(219, 234, 254, 0.95);
      backdrop-filter: blur(18px);
    }

    .section::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 5px;
      background: linear-gradient(90deg, var(--blue-900), var(--blue-600), #93c5fd);
    }

    .section::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      left: -80px;
      top: -90px;
      background: rgba(37, 99, 235, 0.08);
      border-radius: 50%;
      pointer-events: none;
    }

    .section-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      z-index: 1;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title h2 {
      font-size: 23px;
      letter-spacing: -0.4px;
      color: var(--blue-950);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      padding: 6px 11px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--blue-50), var(--blue-100));
      color: var(--blue-800);
      font-size: 13px;
      font-weight: 900;
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .package-buttons {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
      z-index: 1;
    }

    .package-btn,
    .btn {
      border: 0;
      border-radius: 16px;
      padding: 13px 15px;
      cursor: pointer;
      font-weight: 900;
      transition: 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .package-btn::before,
    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
      transform: translateX(120%);
      transition: 0.45s;
    }

    .package-btn:hover::before,
    .btn:hover::before {
      transform: translateX(-120%);
    }

    .package-btn {
      background: linear-gradient(180deg, #ffffff, var(--blue-50));
      color: var(--blue-700);
      border: 1px solid #bfdbfe;
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.08);
    }

    .package-btn:hover {
      transform: translateY(-3px);
      background: linear-gradient(135deg, var(--blue-700), var(--blue-500));
      color: #fff;
      box-shadow: 0 16px 30px rgba(37, 99, 235, 0.22);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue-700), var(--blue-500));
      color: #fff;
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.20);
    }

    .btn-dark {
      background: linear-gradient(135deg, var(--blue-950), var(--blue-800));
      color: #fff;
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.18);
    }

    .btn-danger {
      background: linear-gradient(180deg, #fff, #eff6ff);
      color: var(--blue-800);
      border: 1px solid var(--line);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .cards {
      position: relative;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 16px;
      z-index: 1;
    }

    .teacher-card {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.96), rgba(239,246,255,0.78)),
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.14), transparent 40%);
      border: 1px solid rgba(191, 219, 254, 0.95);
      border-radius: 24px;
      padding: 20px;
      cursor: pointer;
      position: relative;
      min-height: 195px;
      box-shadow: 0 16px 36px rgba(37, 99, 235, 0.10);
      transition: 0.25s ease;
      overflow: hidden;
    }

    .teacher-card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      background: linear-gradient(180deg, var(--blue-700), var(--blue-500), #bfdbfe);
    }

    .teacher-card::after {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      left: -35px;
      bottom: -35px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.08);
    }

    .teacher-card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: var(--blue-500);
      box-shadow: 0 24px 50px rgba(37, 99, 235, 0.18);
    }

    .teacher-card h3 {
      font-size: 21px;
      margin-bottom: 9px;
      color: var(--blue-950);
      padding-right: 8px;
    }

    .teacher-card p {
      font-size: 14px;
      margin: 6px 0;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }

    .card-footer {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }

    .progress-mini {
      height: 9px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      flex: 1;
      box-shadow: inset 0 1px 2px rgba(15,23,42,0.10);
    }

    .progress-mini span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--blue-800), var(--blue-500));
      border-radius: 999px;
      width: 0%;
    }

    .modal {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 15%, rgba(37,99,235,0.28), transparent 28%),
        rgba(7, 17, 31, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: linear-gradient(180deg, #ffffff, #f8fbff);
      width: min(1120px, 100%);
      max-height: 90vh;
      overflow: auto;
      border-radius: 30px;
      padding: 26px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.34);
      border: 1px solid rgba(219,234,254,0.95);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.92);
      padding-bottom: 14px;
      z-index: 2;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(219,234,254,0.8);
    }

    .modal-header h2 {
      color: var(--blue-950);
      letter-spacing: -0.4px;
    }

    .close-btn {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #fff, var(--blue-50));
      color: var(--blue-900);
      border-radius: 14px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 900;
      transition: 0.25s;
    }

    .close-btn:hover {
      transform: translateY(-2px);
      background: var(--blue-100);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    label {
      display: block;
      font-size: 14px;
      color: var(--blue-900);
      margin-bottom: 7px;
      font-weight: 900;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfe0ff;
      border-radius: 16px;
      padding: 13px 14px;
      outline: none;
      font-size: 14px;
      background: rgba(255,255,255,0.92);
      transition: 0.25s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--blue-500);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
    }

    @media (max-width: 1000px) {
      .details-grid {
        grid-template-columns: 1fr;
      }
    }

    .info-panel,
    .timeline-panel,
    .progress-box {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.95), rgba(239,246,255,0.72));
      border: 1px solid rgba(191, 219, 254, 0.95);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 14px 34px rgba(37, 99, 235, 0.08);
    }

    .info-panel h3,
    .timeline-panel h3,
    .progress-box h3 {
      color: var(--blue-950);
      margin-bottom: 10px;
    }

    .info-panel p,
    .timeline-panel p,
    .progress-box p {
      color: var(--muted);
      margin: 7px 0;
    }

    .progress-track {
      height: 18px;
      background: #dbeafe;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
      box-shadow: inset 0 2px 5px rgba(15,23,42,0.10);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blue-900), var(--blue-600), #93c5fd);
      border-radius: 999px;
      transition: 0.4s;
    }

    .status-text {
      font-weight: 900;
      font-size: 15px;
    }

    .status-good { color: var(--green); }
    .status-late { color: var(--red); }
    .status-warn { color: var(--orange); }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(37, 99, 235, 0.10);
      border: 1px solid rgba(219,234,254,0.9);
    }

    th,
    td {
      border-bottom: 1px solid #e8f1ff;
      padding: 13px;
      text-align: right;
      font-size: 14px;
      vertical-align: top;
    }

    th {
      background: linear-gradient(135deg, var(--blue-950), var(--blue-800));
      color: #fff;
      white-space: nowrap;
      font-weight: 900;
    }

    tr:nth-child(even) td {
      background: #f8fbff;
    }

    tr:hover td {
      background: #eff6ff;
    }

    td input[type="checkbox"] {
      width: 21px;
      height: 21px;
      cursor: pointer;
      accent-color: var(--blue-600);
    }

    .task-note {
      min-height: 55px;
      font-size: 13px;
    }

    .task-row-note td {
      background: linear-gradient(135deg, #fff7ed, #fed7aa) !important;
      border-bottom-color: #fdba74;
    }

    .task-row-note textarea,
    .task-row-note input[type="date"] {
      border-color: #fb923c;
      background: #fff7ed;
    }

    .task-row-done td {
      background: linear-gradient(135deg, #f0fdf4, #bbf7d0) !important;
      border-bottom-color: #86efac;
    }

    .task-row-done textarea,
    .task-row-done input[type="date"] {
      border-color: #22c55e;
      background: #f0fdf4;
    }

    .task-row-done td input[type="checkbox"] {
      accent-color: var(--green);
    }

    .task-type-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0;
      padding: 10px;
      background: rgba(239,246,255,0.75);
      border: 1px solid rgba(219,234,254,0.95);
      border-radius: 22px;
    }

    .task-type-btn {
      border: 1px solid #bfdbfe;
      background: linear-gradient(180deg, #fff, var(--blue-50));
      color: var(--blue-700);
      border-radius: 16px;
      padding: 12px 15px;
      cursor: pointer;
      font-weight: 900;
      transition: 0.25s;
      box-shadow: 0 8px 18px rgba(37,99,235,0.08);
    }

    .task-type-btn:hover {
      transform: translateY(-3px);
      background: #dbeafe;
    }

    .task-type-btn.active {
      background: linear-gradient(135deg, var(--blue-800), var(--blue-500));
      color: #fff;
      border-color: var(--blue-500);
      box-shadow: 0 16px 30px rgba(37,99,235,0.26);
    }

    .task-type-title {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.98), rgba(239,246,255,0.84));
      border: 1px solid rgba(191,219,254,0.95);
      padding: 15px 16px;
      border-radius: 20px;
      margin: 10px 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.08);
    }

    .task-type-title strong {
      color: var(--blue-950);
      font-size: 18px;
    }

    .task-type-title span {
      color: var(--blue-700);
      font-size: 14px;
      font-weight: 900;
    }



    .studio-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 18px;
      padding: 10px;
      background: rgba(239,246,255,0.75);
      border: 1px solid rgba(219,234,254,0.95);
      border-radius: 22px;
    }

    .studio-btn {
      border: 1px solid #bfdbfe;
      background: linear-gradient(180deg, #fff, var(--blue-50));
      color: var(--blue-700);
      border-radius: 16px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 900;
      transition: 0.25s;
      box-shadow: 0 8px 18px rgba(37,99,235,0.08);
    }

    .studio-btn:hover {
      transform: translateY(-3px);
      background: #dbeafe;
    }

    .studio-btn.active {
      background: linear-gradient(135deg, var(--blue-800), var(--blue-500));
      color: #fff;
      border-color: var(--blue-500);
      box-shadow: 0 16px 30px rgba(37,99,235,0.26);
    }

    .timeline-table td.scheduled-cell {
      background: linear-gradient(135deg, #fff7ed, #fed7aa) !important;
      border: 1px solid #fb923c;
      box-shadow: inset 0 0 0 2px rgba(251, 146, 60, 0.22);
    }

    .timeline-table td.scheduled-cell .timeline-input {
      color: #7c2d12;
      font-weight: 900;
    }

    .timeline-table-wrapper {
      overflow: auto;
      background: rgba(255,255,255,0.9);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 18px 44px rgba(37, 99, 235, 0.11);
      margin-top: 24px;
      border: 1px solid rgba(219,234,254,0.95);
    }

    .timeline-table {
      min-width: 950px;
    }

    .timeline-table th {
      background: linear-gradient(135deg, var(--blue-950), var(--blue-800));
      font-size: 13px;
    }

    .timeline-table td {
      height: 56px;
      min-width: 120px;
      background: #fff;
    }

    .timeline-table td:first-child,
    .timeline-table th:first-child {
      position: sticky;
      right: 0;
      z-index: 1;
      background: linear-gradient(180deg, var(--blue-50), #ffffff);
      color: var(--blue-950);
      font-weight: 900;
      min-width: 95px;
      border-left: 1px solid var(--line);
    }

    .timeline-input {
      border: 0;
      background: transparent;
      min-height: 40px;
      padding: 6px;
      font-size: 12px;
      box-shadow: none !important;
    }

    .timeline-input:focus {
      background: #fff;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.10) !important;
    }

    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 34px 10px;
      background:
        linear-gradient(135deg, #fff, var(--blue-50));
      border-radius: 22px;
      border: 1px dashed #93c5fd;
      font-weight: 800;
    }

    .week-target {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    @media (max-width: 700px) {
      .week-target {
        grid-template-columns: 1fr 1fr;
      }
    }

    .week-card {
      background: linear-gradient(180deg, #fff, var(--blue-50));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 13px;
      text-align: center;
      box-shadow: 0 8px 18px rgba(37,99,235,0.06);
    }

    .week-card strong {
      display: block;
      margin-bottom: 5px;
      color: var(--blue-950);
    }

    .week-card span {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 560px) {
      header {
        padding: 32px 16px 42px;
      }

      .container {
        width: 94%;
        margin-top: -18px;
      }

      .section,
      .modal-content {
        padding: 18px;
        border-radius: 24px;
      }

      .package-buttons {
        grid-template-columns: 1fr;
      }

      .teacher-card {
        min-height: 205px;
      }

      th,
      td {
        padding: 10px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>إدارة الباكدجات التسويقية للمدرسين</h1>
  </header>

  <main class="container">
    <section id="homeView" class="view-section active">
      <div class="portal-intro">
      </div>

      <div class="portal-cards">
        <button class="portal-card facebook-card" onclick="openView('facebookView')" aria-label="فتح باكدجات الفيس بوك">
          <span class="portal-label">قسم الباكدجات</span>
          <h2>باكدجات  <br>الفيس بوك</h2>
          <div class="portal-icon">f</div>
          <div class="portal-meta"><span class="portal-count" id="portalFacebookCount">0</span><span>باكدج مضافة</span></div>
        </button>

        <button class="portal-card youtube-card" onclick="openView('youtubeView')" aria-label="فتح باكدجات اليوتيوب">
          <span class="portal-label">قسم الفيديو</span>
          <h2>باكدجات   <br>اليوتيوب</h2>
          <div class="portal-icon"></div>
          <div class="portal-meta"><span class="portal-count" id="portalYoutubeCount">0</span><span>باكدج مضافة</span></div>
        </button>

        <button class="portal-card studio-card" onclick="openView('studiosView')" aria-label="فتح الاستوديوهات">
          <span class="portal-label">جدول زمني</span>
          <h2>الاستوديوهات</h2>
          <div class="portal-icon"></div>
          <div class="portal-meta"><span class="portal-count">2</span><span>استوديو</span></div>
        </button>
      </div>
    </section>

    <section id="facebookView" class="view-section">
      <div class="back-row">
        <button class="back-btn" onclick="goHome()">↩ رجوع للأقسام</button>
      </div>

      <div class="top-actions">
        <input id="searchInput" class="search-box" type="text" placeholder="ابحث باسم المدرس، المادة، المحافظة، أو نوع الباكدج..." oninput="renderAllCards()" />
        <button class="btn btn-dark" onclick="resetAllData()">مسح كل البيانات</button>
      </div>

      <div class="section">
        <div class="section-header">
          <div class="section-title">
            <h2>باكدجات فيس بوك</h2>
            <span class="badge" id="facebookCount">0</span>
          </div>
        </div>

        <div class="package-buttons">
          <button class="package-btn" onclick="openTeacherModal('facebook', 'face 1')">face 1</button>
          <button class="package-btn" onclick="openTeacherModal('facebook', 'face 2')">face 2</button>
          <button class="package-btn" onclick="openTeacherModal('facebook', 'face 3')">face 3</button>
        </div>

        <div id="facebookCards" class="cards"></div>
      </div>
    </section>

    <section id="youtubeView" class="view-section">
      <div class="back-row">
        <button class="back-btn" onclick="goHome()">↩ رجوع للأقسام</button>
      </div>

      <div class="top-actions">
        <input id="youtubeSearchInput" class="search-box" type="text" placeholder="ابحث باسم المدرس، المادة، المحافظة، أو نوع الباكدج..." oninput="syncSearch(this.value)" />
        <button class="btn btn-dark" onclick="resetAllData()">مسح كل البيانات</button>
      </div>

      <div class="section">
        <div class="section-header">
          <div class="section-title">
            <h2>باكدجات يوتيوب</h2>
            <span class="badge" id="youtubeCount">0</span>
          </div>
        </div>

        <div class="package-buttons">
          <button class="package-btn" onclick="openTeacherModal('youtube', 'youtube 1')">youtube 1</button>
          <button class="package-btn" onclick="openTeacherModal('youtube', 'youtube 2')">youtube 2</button>
          <button class="package-btn" onclick="openTeacherModal('youtube', 'youtube 3')">youtube 3</button>
        </div>

        <div id="youtubeCards" class="cards"></div>
      </div>
    </section>

    <section id="studiosView" class="view-section">
      <div class="back-row">
        <button class="back-btn" onclick="goHome()">↩ رجوع للأقسام</button>
      </div>

      <section class="section">
        <div class="section-header">
          <div class="section-title">
            <h2 id="timelineTitle">جدول استوديو السادات</h2>
            <span class="badge">8 صباحاً - 2 صباحاً</span>
          </div>
        </div>
        <p style="color:#6b7280; margin-bottom: 12px;">اختار الاستوديو من الأزرار، واكتب المعاد أو المهمة داخل الخانة. أي خانة يتم تحديدها ستظهر بلون مختلف تلقائياً.</p>
        <div class="studio-tabs">
          <button id="sadatStudioBtn" class="studio-btn active" onclick="switchStudio('sadat')">جدول استوديو السادات</button>
          <button id="shebinStudioBtn" class="studio-btn" onclick="switchStudio('shebin')">جدول استوديو شبين</button>
        </div>
        <div class="timeline-table-wrapper">
          <table class="timeline-table" id="dailyTimeline"></table>
        </div>
      </section>
    </section>
  </main>

  <div class="modal" id="teacherModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="teacherModalTitle">إضافة مدرس</h2>
        <button class="close-btn" onclick="closeModal('teacherModal')">إغلاق</button>
      </div>

      <form id="teacherForm" onsubmit="saveTeacher(event)">
        <div class="form-grid">
          <div>
            <label>اسم المدرس</label>
            <input id="teacherName" type="text" required placeholder="مثال: أ/ محمد أحمد" />
          </div>
          <div>
            <label>المادة</label>
            <input id="subject" type="text" required placeholder="مثال: فيزياء" />
          </div>
          <div>
            <label>المحافظة</label>
            <input id="governorate" type="text" required placeholder="مثال: القاهرة" />
          </div>
          <div>
            <label>تاريخ الاشتراك</label>
            <input id="subscriptionDate" type="date" required />
          </div>
          <div class="full">
            <label>تفاصيل إضافية</label>
            <textarea id="extraDetails" placeholder="اكتب أي ملاحظات خاصة بالمدرس أو طريقة الشغل..."></textarea>
          </div>
          <div class="full">
            <button class="btn btn-primary" type="submit">حفظ المدرس والباكدج</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="detailsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="detailsTitle">تفاصيل الباكدج</h2>
        <button class="close-btn" onclick="closeModal('detailsModal')">إغلاق</button>
      </div>
      <div id="detailsContent"></div>
    </div>
  </div>

  <script>
    const packageTemplates = {
      "face 1": [
        { type: "تصميم سوشيال ميديا", count: 4 },
        { type: "بوست متنوع", count: 4 },
        { type: "ريل", count: 2 }
      ],
      "face 2": [
        { type: "تصميم سوشيال ميديا", count: 8 },
        { type: "بوست متنوع", count: 4 },
        { type: "ريل", count: 4 }
      ],
      "face 3": [
        { type: "تصميم سوشيال ميديا", count: 8 },
        { type: "بوست متنوع", count: 8 },
        { type: "ريلز", count: 8 }
      ],
      "youtube 1": [
        { type: "تصوير استوديو", count: 8, unit: "ساعة" },
        { type: "تصميم", count: 5 },
        { type: "ريل من الشرح", count: 4 }
      ],
      "youtube 2": [
        { type: "تصوير استوديو", count: 16, unit: "ساعة" },
        { type: "تصميم", count: 10 },
        { type: "ريل من الشرح", count: 8 }
      ],
      "youtube 3": [
        { type: "تصوير استوديو", count: 24, unit: "ساعة" },
        { type: "تصميم", count: 12 },
        { type: "ريل من الشرح", count: 12 }
      ]
    };

    const days = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"];
    const hours = ["8 ص", "9 ص", "10 ص", "11 ص", "12 م", "1 م", "2 م", "3 م", "4 م", "5 م", "6 م", "7 م", "8 م", "9 م", "10 م", "11 م", "12 ص", "1 ص", "2 ص"];

    let selectedCategory = "";
    let selectedPackage = "";
    let selectedTeacherId = null;
    let selectedTaskTypeByTeacher = {};

    let teachers = JSON.parse(localStorage.getItem("marketingTeachers")) || [];
    let selectedStudio = localStorage.getItem("selectedStudio") || "sadat";
    let timelineData = JSON.parse(localStorage.getItem("dailyTimelineData")) || { sadat: {}, shebin: {} };

    if (!timelineData.sadat || !timelineData.shebin) {
      timelineData = {
        sadat: timelineData || {},
        shebin: {}
      };
    }

    function makeId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
    }

    function saveToStorage() {
      localStorage.setItem("marketingTeachers", JSON.stringify(teachers));
      localStorage.setItem("dailyTimelineData", JSON.stringify(timelineData));
      localStorage.setItem("selectedStudio", selectedStudio);
    }

    function openView(viewId) {
      document.querySelectorAll(".view-section").forEach(section => section.classList.remove("active"));
      document.getElementById(viewId).classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderAllCards();
      renderDailyTimeline();
    }

    function goHome() {
      document.querySelectorAll(".view-section").forEach(section => section.classList.remove("active"));
      document.getElementById("homeView").classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderAllCards();
    }

    function syncSearch(value) {
      const mainSearch = document.getElementById("searchInput");
      if (mainSearch) mainSearch.value = value;
      renderAllCards();
    }

    function openTeacherModal(category, packageName) {
      selectedCategory = category;
      selectedPackage = packageName;
      document.getElementById("teacherModalTitle").textContent = `إضافة مدرس - ${packageName}`;
      document.getElementById("teacherForm").reset();
      document.getElementById("subscriptionDate").valueAsDate = new Date();
      document.getElementById("teacherModal").classList.add("active");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("active");
    }

    function generateTasks(packageName, subscriptionDate) {
      const template = packageTemplates[packageName];
      const tasks = [];
      let taskNumber = 1;
      const start = new Date(subscriptionDate);
      const totalCount = template.reduce((sum, item) => sum + item.count, 0);
      const interval = Math.max(1, Math.floor(30 / totalCount));

      template.forEach(item => {
        for (let i = 1; i <= item.count; i++) {
          const due = new Date(start);
          due.setDate(start.getDate() + ((taskNumber - 1) * interval));
          const unitText = item.unit ? `${item.unit} ` : "";

          tasks.push({
            id: makeId(),
            type: item.type,
            title: `${unitText}${item.type} رقم ${i}`,
            done: false,
            notes: "",
            dueDate: due.toISOString().split("T")[0],
            uploadDate: ""
          });

          taskNumber++;
        }
      });

      return tasks;
    }

    function saveTeacher(event) {
      event.preventDefault();

      const subscriptionDate = document.getElementById("subscriptionDate").value;

      const teacher = {
        id: makeId(),
        category: selectedCategory,
        packageName: selectedPackage,
        name: document.getElementById("teacherName").value.trim(),
        subject: document.getElementById("subject").value.trim(),
        governorate: document.getElementById("governorate").value.trim(),
        subscriptionDate: subscriptionDate,
        extraDetails: document.getElementById("extraDetails").value.trim(),
        tasks: generateTasks(selectedPackage, subscriptionDate)
      };

      teachers.push(teacher);
      selectedTaskTypeByTeacher[teacher.id] = teacher.tasks[0]?.type || "";
      saveToStorage();
      closeModal("teacherModal");
      renderAllCards();
    }

    function getProgress(teacher) {
      if (!teacher.tasks.length) return 0;
      const done = teacher.tasks.filter(task => task.done).length;
      return Math.round((done / teacher.tasks.length) * 100);
    }

    function getExpectedProgress(teacher) {
      const start = new Date(teacher.subscriptionDate);
      const today = new Date();
      const diffDays = Math.floor((today - start) / (1000 * 60 * 60 * 24));
      return Math.min(100, Math.max(0, Math.round((diffDays / 30) * 100)));
    }

    function getStatus(teacher) {
      const actual = getProgress(teacher);
      const expected = getExpectedProgress(teacher);
      if (actual + 10 < expected) return { text: "متأخر", className: "status-late" };
      if (actual < expected) return { text: "محتاج تسرّع", className: "status-warn" };
      return { text: "تمام", className: "status-good" };
    }

    function renderCards(category, containerId) {
      const container = document.getElementById(containerId);
      const query = (document.getElementById("searchInput")?.value || document.getElementById("youtubeSearchInput")?.value || "").toLowerCase().trim();
      const filtered = teachers.filter(t => {
        const text = `${t.name} ${t.subject} ${t.governorate} ${t.packageName}`.toLowerCase();
        return t.category === category && text.includes(query);
      });

      if (!filtered.length) {
        container.innerHTML = `<div class="empty-state">لا توجد باكدجات مضافة حتى الآن</div>`;
        return;
      }

      container.innerHTML = filtered.map(teacher => {
        const progress = getProgress(teacher);
        const status = getStatus(teacher);
        return `
          <div class="teacher-card" onclick="openDetails('${teacher.id}')">
            <h3>${teacher.name}</h3>
            <p><strong>المادة:</strong> ${teacher.subject}</p>
            <p><strong>المحافظة:</strong> ${teacher.governorate}</p>
            <p><strong>الباكدج:</strong> ${teacher.packageName}</p>
            <p><strong>الاشتراك:</strong> ${teacher.subscriptionDate}</p>
            <div class="card-footer">
              <span class="status-text ${status.className}">${status.text}</span>
              <div class="progress-mini"><span style="width:${progress}%"></span></div>
              <strong>${progress}%</strong>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderAllCards() {
      renderCards("facebook", "facebookCards");
      renderCards("youtube", "youtubeCards");
      const facebookTotal = teachers.filter(t => t.category === "facebook").length;
      const youtubeTotal = teachers.filter(t => t.category === "youtube").length;
      document.getElementById("facebookCount").textContent = facebookTotal;
      document.getElementById("youtubeCount").textContent = youtubeTotal;
      document.getElementById("portalFacebookCount").textContent = facebookTotal;
      document.getElementById("portalYoutubeCount").textContent = youtubeTotal;
    }

    function openDetails(id) {
      selectedTeacherId = id;
      const teacher = teachers.find(t => t.id === id);
      if (!teacher) return;

      const types = getTaskTypes(teacher);
      if (!selectedTaskTypeByTeacher[teacher.id] || !types.includes(selectedTaskTypeByTeacher[teacher.id])) {
        selectedTaskTypeByTeacher[teacher.id] = types[0];
      }

      const progress = getProgress(teacher);
      const expected = getExpectedProgress(teacher);
      const status = getStatus(teacher);
      const weeklyTarget = Math.ceil(teacher.tasks.length / 4);
      const doneCount = teacher.tasks.filter(t => t.done).length;

      document.getElementById("detailsTitle").textContent = `${teacher.name} - ${teacher.packageName}`;
      document.getElementById("detailsContent").innerHTML = `
        <div class="details-grid">
          <div>
            <div class="info-panel">
              <h3 style="margin-bottom:10px;">بيانات المدرس</h3>
              <p><strong>الاسم:</strong> ${teacher.name}</p>
              <p><strong>المادة:</strong> ${teacher.subject}</p>
              <p><strong>المحافظة:</strong> ${teacher.governorate}</p>
              <p><strong>تاريخ الاشتراك:</strong> ${teacher.subscriptionDate}</p>
              <p><strong>تفاصيل إضافية:</strong> ${teacher.extraDetails || "لا يوجد"}</p>
            </div>

            <div class="progress-box">
              <h3>مؤشر تقدم الباكدج بالكامل</h3>
              <div class="progress-track">
                <div class="progress-fill" style="width:${progress}%"></div>
              </div>
              <p><strong>المنجز:</strong> ${doneCount} من ${teacher.tasks.length} تاسك - ${progress}%</p>
              <p><strong>المفروض حتى الآن:</strong> ${expected}%</p>
              <p class="status-text ${status.className}">الحالة: ${status.text}</p>

              <div class="week-target">
                <div class="week-card"><strong>الأسبوع 1</strong><span>${weeklyTarget} تاسك تقريباً</span></div>
                <div class="week-card"><strong>الأسبوع 2</strong><span>${weeklyTarget} تاسك تقريباً</span></div>
                <div class="week-card"><strong>الأسبوع 3</strong><span>${weeklyTarget} تاسك تقريباً</span></div>
                <div class="week-card"><strong>الأسبوع 4</strong><span>${weeklyTarget} تاسك تقريباً</span></div>
              </div>
            </div>
          </div>

          <div class="timeline-panel">
            <h3 style="margin-bottom:10px;">محتويات الباكدج</h3>
            ${renderPackageSummary(teacher.packageName)}
            <button class="btn btn-danger" style="margin-top:14px;" onclick="deleteTeacher('${teacher.id}')">حذف المدرس</button>
          </div>
        </div>

        <h3 style="margin: 16px 0;">جدول التاسكات حسب النوع</h3>
        ${renderTaskTypeButtons(teacher)}
        <div id="taskTypeTable">
          ${renderTaskTableByType(teacher)}
        </div>
      `;

      document.getElementById("detailsModal").classList.add("active");
    }

    function renderPackageSummary(packageName) {
      return packageTemplates[packageName].map(item => {
        const unit = item.unit ? item.unit : "تاسك";
        return `<p style="margin:8px 0;"><strong>${item.count}</strong> ${unit} × ${item.type}</p>`;
      }).join("");
    }

    function getTaskTypes(teacher) {
      return [...new Set(teacher.tasks.map(task => task.type))];
    }

    function escapeForOnClick(text) {
      return text.replace(/'/g, "\'");
    }

    function renderTaskTypeButtons(teacher) {
      const types = getTaskTypes(teacher);

      return `
        <div class="task-type-tabs">
          ${types.map(type => {
            const total = teacher.tasks.filter(task => task.type === type).length;
            const done = teacher.tasks.filter(task => task.type === type && task.done).length;
            const active = selectedTaskTypeByTeacher[teacher.id] === type ? "active" : "";
            return `<button class="task-type-btn ${active}" onclick="showTaskType('${teacher.id}', '${escapeForOnClick(type)}')">${type} <small>(${done}/${total})</small></button>`;
          }).join("")}
        </div>
      `;
    }

    function renderTaskTableByType(teacher) {
      const activeType = selectedTaskTypeByTeacher[teacher.id] || getTaskTypes(teacher)[0];
      const tasks = teacher.tasks.filter(task => task.type === activeType);
      const done = tasks.filter(task => task.done).length;
      const progress = tasks.length ? Math.round((done / tasks.length) * 100) : 0;

      return `
        <div class="task-type-title">
          <strong>${activeType}</strong>
          <span>تم تنفيذ ${done} من ${tasks.length} - ${progress}%</span>
        </div>

        <div class="progress-track">
          <div class="progress-fill" style="width:${progress}%"></div>
        </div>

        <div style="overflow:auto;">
          <table>
            <thead>
              <tr>
                <th>تم</th>
                <th>اسم التاسك</th>
                <th>تفاصيل التاسك</th>
                <th>تاريخ التنفيذ</th>
                <th>تاريخ الرفع</th>
              </tr>
            </thead>
            <tbody>
              ${tasks.map(task => {
                const taskRowClass = task.done ? "task-row-done" : ((task.notes || "").trim() ? "task-row-note" : "");
                return `
                <tr class="${taskRowClass}">
                  <td><input type="checkbox" ${task.done ? "checked" : ""} onchange="updateTask('${task.id}', 'done', this.checked)"></td>
                  <td>${task.title}</td>
                  <td><textarea class="task-note" oninput="updateTaskLive('${task.id}', 'notes', this.value, this)" placeholder="تفاصيل أو ملاحظات...">${task.notes || ""}</textarea></td>
                  <td><input type="date" value="${task.dueDate || ""}" onchange="updateTask('${task.id}', 'dueDate', this.value)"></td>
                  <td><input type="date" value="${task.uploadDate || ""}" onchange="updateTask('${task.id}', 'uploadDate', this.value)"></td>
                </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function showTaskType(teacherId, type) {
      selectedTaskTypeByTeacher[teacherId] = type;
      openDetails(teacherId);
    }

    function updateTaskLive(taskId, field, value, element) {
      const teacher = teachers.find(t => t.id === selectedTeacherId);
      if (!teacher) return;

      const task = teacher.tasks.find(t => t.id === taskId);
      if (!task) return;

      task[field] = value;
      saveToStorage();

      const row = element.closest("tr");
      if (!row) return;

      row.classList.remove("task-row-note", "task-row-done");
      if (task.done) {
        row.classList.add("task-row-done");
      } else if ((task.notes || "").trim()) {
        row.classList.add("task-row-note");
      }
    }

    function updateTask(taskId, field, value) {
      const teacher = teachers.find(t => t.id === selectedTeacherId);
      if (!teacher) return;

      const task = teacher.tasks.find(t => t.id === taskId);
      if (!task) return;

      task[field] = value;
      saveToStorage();
      openDetails(selectedTeacherId);
      renderAllCards();
    }

    function deleteTeacher(id) {
      if (!confirm("هل أنت متأكد من حذف هذا المدرس؟")) return;
      teachers = teachers.filter(t => t.id !== id);
      delete selectedTaskTypeByTeacher[id];
      saveToStorage();
      closeModal("detailsModal");
      renderAllCards();
    }

    function getCurrentStudioData() {
      if (!timelineData[selectedStudio]) timelineData[selectedStudio] = {};
      return timelineData[selectedStudio];
    }

    function switchStudio(studio) {
      selectedStudio = studio;
      saveToStorage();
      renderDailyTimeline();
    }

    function renderDailyTimeline() {
      const table = document.getElementById("dailyTimeline");
      const currentData = getCurrentStudioData();
      const studioNames = {
        sadat: "جدول استوديو السادات",
        shebin: "جدول استوديو شبين"
      };

      document.getElementById("timelineTitle").textContent = studioNames[selectedStudio];
      document.getElementById("sadatStudioBtn").classList.toggle("active", selectedStudio === "sadat");
      document.getElementById("shebinStudioBtn").classList.toggle("active", selectedStudio === "shebin");

      let html = `<thead><tr><th>الوقت</th>${days.map(day => `<th>${day}</th>`).join("")}</tr></thead><tbody>`;

      hours.forEach(hour => {
        html += `<tr><td>${hour}</td>`;
        days.forEach(day => {
          const key = `${day}-${hour}`;
          const value = currentData[key] || "";
          const selectedClass = value.trim() ? "scheduled-cell" : "";
          html += `<td class="${selectedClass}"><textarea class="timeline-input" placeholder="اكتب معاد..." oninput="saveTimelineCell('${key}', this.value, this)">${value}</textarea></td>`;
        });
        html += `</tr>`;
      });

      html += `</tbody>`;
      table.innerHTML = html;
    }

    function saveTimelineCell(key, value, input) {
      const currentData = getCurrentStudioData();
      currentData[key] = value;
      input.closest("td").classList.toggle("scheduled-cell", value.trim() !== "");
      saveToStorage();
    }

    function resetAllData() {
      if (!confirm("سيتم مسح كل المدرسين والجدول الزمني. هل تريد المتابعة؟")) return;
      teachers = [];
      timelineData = { sadat: {}, shebin: {} };
      selectedStudio = "sadat";
      selectedTaskTypeByTeacher = {};
      saveToStorage();
      renderAllCards();
      renderDailyTimeline();
    }

    window.addEventListener("click", function(event) {
      if (event.target.classList.contains("modal")) {
        event.target.classList.remove("active");
      }
    });

    renderAllCards();
    renderDailyTimeline();
  </script>
</body>
</html>
